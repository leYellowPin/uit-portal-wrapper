<div id="cd-titlebar">
  <div id="cd-titlebar-left">
    <img id="cd-titlebar-icon" alt="" />
    <span id="cd-titlebar-title">UIT Portal Wrapper</span>
  </div>

  <div id="cd-search-wrap">
    <svg id="cd-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      id="cd-search-input"
      placeholder="Tìm trang hoặc mục (Ctrl+K)"
      autocomplete="off"
      spellcheck="false"
    />
    <div id="cd-search-results" class="cd-dropdown-menu" hidden></div>
  </div>

  <div id="cd-titlebar-controls">
    <button type="button" id="cd-toggle-sidebar-btn" class="cd-titlebar-btn" title="Ẩn/hiện thanh bên" aria-label="Ẩn/hiện thanh bên">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
    </button>
    <button type="button" id="cd-toggle-header-btn" class="cd-titlebar-btn" title="Ẩn/hiện thanh thông tin" aria-label="Ẩn/hiện thanh thông tin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
      </svg>
    </button>
    <button type="button" id="cd-refresh-btn" class="cd-titlebar-btn" title="Tải lại trang" aria-label="Tải lại trang">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </div>
</div>
